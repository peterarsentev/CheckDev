databaseChangeLog:
- changeSet:
    id: 1
    author: includeAll
    objectQuotingStrategy: LEGACY
    changes:
    - sql:
        splitStatements: false
        sql: "create table if not exists interview (\r\nid serial primary key ,\r\n\
          type_interview int,\r\nsubmitter_id int,\r\ntitle varchar(765),\r\ndescription\
          \ text,\r\ncontact_by varchar(765),\r\napproximate_date varchar(256)\r\n\
          );"
        stripComments: false
- changeSet:
    id: 2
    author: includeAll
    objectQuotingStrategy: LEGACY
    changes:
    - sql:
        splitStatements: false
        sql: "create table if not exists wisher (\r\nid serial primary key ,\r\ninterview_id\
          \ int references interview(id),\r\nuser_id int,\r\ncontact_by varchar(765),\r\
          \napprove boolean default false\r\n);"
        stripComments: false
